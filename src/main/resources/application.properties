# Spring profile (local dev default)
spring.profiles.active=dev

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestao_aluguel}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway (migration scripts under classpath:db/migration)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:change-me-super-secret-key-at-least-64-characters-long-please-change}
app.jwt.expiration=86400000

# Auth
app.auth.registration-enabled=true

# Email configuration
app.email.from=no-reply@gestao-aluguel.local
app.frontend.url=http://localhost:3000
spring.mail.host=${SPRING_MAIL_HOST:smtp.example.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password policy
app.password.min-length=8
app.password.max-length=255

# Rate limiting
app.rate-limit.max-attempts=5
app.rate-limit.lock-duration-minutes=15
app.rate-limit.forgot-password.max-attempts=5
app.rate-limit.forgot-password.lock-duration-minutes=15

# Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.max-file-size=10485760

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG

spring.application.name=gestao-aluguel

# Payment reminder emails to tenants (1st day of each month at 8:00 AM)
app.reminder.enabled=true
app.reminder.cron=0 0 8 1 * ?
